<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TILT KART Controller</title><link rel="stylesheet" href="style.css"></head><body class="phone"><div id="joinScreen" class="phone-panel"><small>YOUR PHONE IS THE CONTROLLER</small><h1>🏎️ TILT <em>KART</em></h1><input id="code" maxlength="4" placeholder="4-letter room code" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;margin-bottom:0"><input id="name" maxlength="16" placeholder="Your racer name" autocomplete="off"><button id="join">JOIN RACE →</button><p id="error"></p></div><div id="controlScreen" hidden><div class="controller-top"><span id="racerName"></span><span id="raceState">WAITING FOR START</span></div><div class="steer"><div class="wheel">◉</div><div id="steerText">TILT TO STEER</div><div class="meter"><div id="meterFill"></div></div><button id="motion">ENABLE TILT CONTROL</button><p>Hold phone upright like a Wii remote and rotate left/right.</p></div><div class="controls"><button id="left" class="secondary">◀</button><button id="brake">BRAKE</button><button id="boost">⚡ BOOST</button><button id="gas">GAS</button><button id="right" class="secondary">▶</button></div><div class="phone-bottom">Touch arrows are a fallback if motion access is unavailable.</div></div><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script src="controller.js"></script></body></html>
